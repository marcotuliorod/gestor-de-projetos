services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestor}
      POSTGRES_USER: ${POSTGRES_USER:-gestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Proxy Headroom (RF-15/RNF-02) — comprime tool outputs/logs antes de
  # chegarem à Anthropic. Serviço próprio: só o worker de agentes usa,
  # então fica fora da imagem principal (web/worker, ver Dockerfile).
  # Sem HEADROOM_PROXY_URL configurado no .env, web/worker sobem mesmo sem
  # este serviço no ar — o roteamento em apps/agents/agent_client.py é opt-in.
  headroom:
    build:
      context: .
      dockerfile: Dockerfile.headroom
    # Achado real no log de start do próprio Headroom: "non-loopback bind
    # with NO token — /v1/* is UNAUTHENTICATED". Porta publicada pro host
    # aqui só por conveniência de dev local, mesma convenção já usada por
    # `db`/`redis` acima (também sem auth, também publicados). Isso NÃO é
    # seguro pra um deploy fora do laptop — antes de qualquer VPS (ver
    # "Fora desta fase" no README), tirar este `ports:` (web/worker já
    # alcançam via rede interna do compose, http://headroom:8787) e/ou
    # configurar HEADROOM_PROXY_TOKEN.
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: .
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - agent-repos:/data/repos
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: sh -c "celery -A config worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-4}"
    volumes:
      - .:/app
      - agent-repos:/data/repos
    env_file: .env
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - db
      - redis

  flower:
    build: .
    command: celery -A config flower --port=5555
    volumes:
      - .:/app
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  postgres-data:
  agent-repos:
