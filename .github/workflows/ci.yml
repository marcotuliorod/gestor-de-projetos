name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Gatilho manual: durante uma indisponibilidade do GitHub Actions, os
  # pushes não chegam a criar run nenhum, e depois não há o que reexecutar.
  # Com isto dá para rodar o CI sob demanda em qualquer commit.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestor
          POSTGRES_USER: gestor
          POSTGRES_PASSWORD: gestor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Necessário desde o RF-21: workspace._project_git_lock usa um lock
      # Redis para serializar as operações git de um mesmo projeto. É
      # mecanismo de correção (protege o mirror compartilhado), então não
      # degrada silenciosamente quando falta Redis — é o CI que precisa
      # espelhar o docker-compose.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://gestor:gestor@localhost:5432/gestor
      REDIS_URL: redis://localhost:6379/0
      # Nenhum teste faz chamada real a GitHub/Anthropic (tudo mockado) —
      # estes valores só precisam existir para django-environ não reclamar.
      GITHUB_APP_ID: "0"
      GITHUB_APP_PRIVATE_KEY_B64: ""
      GITHUB_APP_INSTALLATION_ID: "0"
      GITHUB_WEBHOOK_SECRET: ci-test-webhook-secret
      ANTHROPIC_API_KEY: ""
      AGENTS_FAKE_MODE: "True"
      AGENTS_REPO_ROOT: /tmp/agent-repos-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python manage.py check

      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
