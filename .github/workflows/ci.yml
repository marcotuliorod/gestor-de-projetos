name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Gatilho manual: durante uma indisponibilidade do GitHub Actions, os
  # pushes não chegam a criar run nenhum, e depois não há o que reexecutar.
  # Com isto dá para rodar o CI sob demanda em qualquer commit.
  workflow_dispatch:

# Cada push novo cancela o run anterior ainda em andamento da mesma branch —
# evita empilhar runs que já nascem obsoletos quando vários commits saem em
# sequência rápida (visto nesta sessão).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Roda na mesma imagem de produção (Dockerfile), não em ubuntu+pip cru.
      # As duas únicas quebras reais do CI nesta sessão foram divergência de
      # ambiente: um lock que precisa de Redis e testes que exigem identidade
      # git — nenhuma delas teria aparecido rodando pip install direto no
      # runner. Isso também valida o Dockerfile e o .env.example de quebra:
      # uma dependência de sistema removida, ou um env() novo sem entrada no
      # .env.example, vira falha de CI em vez de surpresa em produção.
      - run: cp .env.example .env

      - name: Build da imagem web
        run: docker compose build web

      - name: Checagens do Django
        run: |
          docker compose run --rm web python manage.py check
          docker compose run --rm web python manage.py makemigrations --check --dry-run

      - name: Suíte de testes
        run: docker compose run --rm web python manage.py test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test -- --run

      - run: npm run lint

      - run: npm run build
